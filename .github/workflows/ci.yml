name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install viewer build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Library without the CLI and viewer dependencies
        run: cargo clippy --lib --no-default-features -- -D warnings
      - name: API documentation builds without warnings
        if: runner.os == 'Linux'
        run: cargo doc --no-deps --lib --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check that the fuzz targets compile
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

  javascript:
    name: JavaScript packages (runtime and build step)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install viewer build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build the bic binary used by the build step tests
        run: cargo build --release --locked --bin bic
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: packages/bic-runtime
        working-directory: packages/bic-runtime
        run: npm ci && npm test
      - name: packages/bic-build
        working-directory: packages/bic-build
        env:
          BIC_BIN: ${{ github.workspace }}/target/release/bic
        run: npm ci && npm test

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        target: [decode, decode_plain, roundtrip]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz for 2 minutes
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=120
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts

  benchmark:
    name: Synthetic corpus benchmark
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install viewer build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release --example gen_corpus -- target/corpus
      - name: Compare (also verifies every BIC roundtrip)
        # Explicit bash enables pipefail, so a failing compare is not hidden by tee.
        shell: bash
        run: |
          cargo run --release -- compare target/corpus --csv target/bench.csv | tee target/bench.txt
          { echo '```'; cat target/bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: |
            target/bench.csv
            target/bench.txt
