name: Demo page

# Builds the BIC site (demo page and documentation) and publishes it to GitHub
# Pages. The page uses the published @proteo5/bic-runtime from npm; every
# number on the site is measured during this build.
on:
  push:
    branches: [main]
    paths: ["site/**", "src/**", "packages/bic-runtime/test/fixtures/**", "Cargo.toml", "Cargo.lock", "README.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install viewer build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: cargo build --release --locked --bin bic
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the site's dependencies (published @proteo5/bic-runtime)
        working-directory: site
        run: npm ci
      - name: Build the site
        run: python site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
